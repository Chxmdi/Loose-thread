name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e 'services/api[dev]'
      - name: Lint
        run: cd services/api && python -m ruff check src tests
      - name: Typecheck
        run: cd services/api && python -m mypy src
      - name: Tests
        run: cd services/api && python -m pytest -q
